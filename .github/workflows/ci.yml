name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck every script
        run: |
          shellcheck -S warning \
            scripts/lib/*.sh \
            scripts/runners/*.sh \
            scripts/commands/*.sh \
            scripts/run_auditor.sh \
            installer/install.sh \
            tests/run_tests.sh \
            tests/lib/*.sh

  markdown-and-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate SKILL.md frontmatter
        run: python3 tests/validate_frontmatter.py .
      - name: Check internal markdown links
        run: python3 tests/check_markdown_links.py .

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure required tools are present
        run: |
          command -v flock >/dev/null || sudo apt-get update && sudo apt-get install -y util-linux
      - name: Run integration test suite
        run: bash tests/run_tests.sh
