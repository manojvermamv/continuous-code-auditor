name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck every script
        # Discovered via find rather than an explicit list: scripts/watchdog.sh
        # was added in v1.1.0 and silently went unchecked because the hardcoded
        # list wasn't updated with it. This can't drift the same way.
        run: |
          mapfile -t files < <(find . -name "*.sh" -not -path "./.git/*" | sort)
          printf 'shellchecking %d file(s):\n' "${#files[@]}"
          printf '  %s\n' "${files[@]}"
          shellcheck -S warning "${files[@]}"

  markdown-and-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate SKILL.md frontmatter
        run: python3 tests/validate_frontmatter.py .
      - name: Check internal markdown links
        run: python3 tests/check_markdown_links.py .
      - name: Verify adapter capability matrix matches actual behavior
        run: bash tests/verify_capabilities.sh .

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure required tools are present
        run: |
          command -v flock >/dev/null || sudo apt-get update && sudo apt-get install -y util-linux
      - name: Run integration test suite
        run: bash tests/run_tests.sh
